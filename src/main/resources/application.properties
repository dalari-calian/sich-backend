spring.application.name=sich-backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sich}
spring.datasource.username=${DB_USER:sich_user}
spring.datasource.password=${DB_PASSWORD:sich1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.flyway.enabled=false
spring.cache.type=simple

spring.banner.charset=UTF-8

server.port=${PORT:4100}
logging.level.org.hibernate.SQL=debug

# JWT — TROQUE o secret em produção (base64 com pelo menos 32 bytes decodificados)
app.security.jwt.secret=Y29sb2NhLXVtLXNlY3JldC1sb25nby1lLWFsZWF0b3Jpby1lbS1iYXNlNjQtY29tLXBlbG8tbWVub3MtMzItYnl0ZXM=
app.security.jwt.expiration-ms=3600000

# OpenAPI / Scalar
springdoc.api-docs.path=/v3/api-docs
springdoc.paths-to-match=/**
# Fuso usado pela agenda (horários dos agendamentos são o relógio de parede do prestador)
app.timezone=America/Sao_Paulo

# Benefícios do cliente: cashback (percentual do valor pago e limite de uso por agendamento) e cartão fidelidade
app.benefits.cashback-rate=0.05
app.benefits.max-cashback-usage-rate=0.20
app.benefits.loyalty-goal=5
app.benefits.loyalty-bonus=10.00
