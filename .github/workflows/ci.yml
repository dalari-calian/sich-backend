name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sich
          POSTGRES_USER: sich_user
          POSTGRES_PASSWORD: sich1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sich_user -d sich"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configura JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Torna o Maven Wrapper executável
        run: chmod +x mvnw

      - name: Compila o projeto
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Executa os testes
        run: ./mvnw -B -ntp test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sich
          SPRING_DATASOURCE_USERNAME: sich_user
          SPRING_DATASOURCE_PASSWORD: sich1234
          APP_SECURITY_JWT_SECRET: Y29sb2NhLXVtLXNlY3JldC1sb25nby1lLWFsZWF0b3Jpby1lbS1iYXNlNjQtY29tLXBlbG8tbWVub3MtMzItYnl0ZXM=
          APP_SECURITY_JWT_EXPIRATION_MS: 3600000

      - name: Publica relatórios de teste (se existirem)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configura Buildx
        uses: docker/setup-buildx-action@v3

      - name: Valida o build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (Render)
    needs: [build-and-test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Dispara o deploy no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL não configurado"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
